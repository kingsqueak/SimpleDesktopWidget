#
# Builds the universal, ad-hoc signed release DMG on a v* tag, or by hand.
# No signing key is kept anywhere, so there's none to leak.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build the app and DMG
        run: ./build.sh dmg

      - name: Check the package
        run: |
          version="$(cat VERSION)"
          app=build/SimpleDesktopWidget.app/Contents/MacOS/SimpleDesktopWidget
          lipo -archs "$app"
          vtool -show-build "$app" | grep minos | sort -u
          codesign --verify --strict build/SimpleDesktopWidget.app
          plutil -extract CFBundleShortVersionString raw build/SimpleDesktopWidget.app/Contents/Info.plist | grep -qx "$version"
          shasum -a 256 build/SimpleDesktopWidget-"$version".dmg

      - uses: actions/upload-artifact@v4
        with:
          name: simpledesktopwidget-dmg
          path: build/SimpleDesktopWidget-*.dmg
          if-no-files-found: error
